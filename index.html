<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/branding/v3/svg/app-icon-ink.svg" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/branding/v3/app-icon/paper-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="atlas.core" />
    <meta id="app-theme-color" name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="atlas.core is the performance operating system for workouts, nutrition, measurements, supplements, and real-world progress."
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:site_name" content="atlas.core" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="atlas.core" />
    <meta
      property="og:description"
      content="atlas.core is the performance operating system for workouts, nutrition, measurements, supplements, and real-world progress."
    />
    <meta property="og:image" content="/branding/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="atlas.core" />
    <meta
      name="twitter:description"
      content="atlas.core is the performance operating system for workouts, nutrition, measurements, supplements, and real-world progress."
    />
    <meta name="twitter:image" content="/branding/og-image.png" />
    <link rel="canonical" href="https://useatlascore.com/" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Web font fallback for the /v2 redesign on non-Apple devices. SF Pro is used natively on macOS/iOS via -apple-system. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700&display=swap" />
    <!-- v3 brand fonts: Archivo Black is the brand voice (logo, splash, manifesto moments only).
         JetBrains Mono carries data: timestamps, codes, set numbers. Keep usage tight. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <title>atlas.core</title>
    <script>
      (function () {
        var THEME_KEY = 'atlas-theme';
        var THEME_EXPLICIT_KEY = 'atlas-theme-explicit';
        var DEFAULT_THEME = 'dark';
        var root = document.documentElement;
        var urlTheme = new URLSearchParams(window.location.search).get('theme');
        var storedTheme = localStorage.getItem(THEME_KEY);
        var hasExplicitPreference = localStorage.getItem(THEME_EXPLICIT_KEY) === 'true';
        var theme =
          (urlTheme === 'dark' || urlTheme === 'light')
            ? urlTheme
            : hasExplicitPreference && (storedTheme === 'dark' || storedTheme === 'light')
            ? storedTheme
            : DEFAULT_THEME;
        var favicon = document.getElementById('app-favicon');
        var appleTouchIcon = document.getElementById('app-apple-touch-icon');
        var themeColor = document.getElementById('app-theme-color');
        var prefersDarkChrome = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);

        if (favicon) {
          favicon.setAttribute('href', prefersDarkChrome ? '/branding/v3/svg/app-icon-paper.svg' : '/branding/v3/svg/app-icon-ink.svg');
          favicon.setAttribute('type', 'image/svg+xml');
        }
        if (appleTouchIcon) appleTouchIcon.setAttribute('href', '/branding/v3/app-icon/paper-180.png');
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#0A0A0A' : '#EFE9DA');
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Pure-CSS splash — visible instantly while the React bundle loads.
           React replaces this div's contents on mount. -->
      <div id="ac-splash" style="
        min-height:100dvh;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:0;
        background:var(--ac-bg);color:var(--ac-fg);
        padding:env(safe-area-inset-top) max(24px,env(safe-area-inset-right))
               env(safe-area-inset-bottom) max(24px,env(safe-area-inset-left));
        box-sizing:border-box;
      ">
        <style>
          :root{--ac-bg:#0A0A0A;--ac-fg:#EFE9DA;--ac-accent:#e8b500;--ac-dim:rgba(239,233,218,0.4);--ac-hair:rgba(239,233,218,0.08)}
          html.light{--ac-bg:#EFE9DA;--ac-fg:#0A0A0A;--ac-dim:rgba(10,10,10,0.4);--ac-hair:rgba(10,10,10,0.08)}
          #ac-splash *{margin:0;padding:0;box-sizing:border-box}
          @keyframes ac-s-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.96)}}
          @keyframes ac-s-trace{0%{stroke-dashoffset:260}80%,100%{stroke-dashoffset:0}}
          @keyframes ac-s-fade{0%,85%{opacity:1}95%,100%{opacity:0}}
          @keyframes ac-s-in{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
        </style>

        <!-- HeartMark -->
        <div style="animation:ac-s-pulse 2.4s ease-in-out infinite">
          <svg width="48" height="48" viewBox="0 0 96 96" style="display:block">
            <path d="M48 82 C34 72,10 58,10 36 C10 22,22 12,32 12 C40 12,44 18,48 24 C52 18,56 12,64 12 C74 12,86 22,86 36 C86 58,62 72,48 82Z" fill="var(--ac-fg)"/>
            <path d="M10 50 L30 50 L36 50 L42 42 L48 60 L54 32 L60 58 L66 50 L86 50" fill="none" stroke="var(--ac-accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <!-- Wordmark -->
        <div style="
          margin-top:20px;
          font-family:'Archivo Black',Impact,sans-serif;
          font-size:28px;letter-spacing:-1.4px;line-height:1;
          text-transform:lowercase;color:var(--ac-fg);
          animation:ac-s-in .6s ease-out both;animation-delay:.15s;
        ">atlas<span style="color:var(--ac-accent)">.</span>core</div>

        <!-- ECG loading trace -->
        <div style="margin-top:32px;width:200px;height:32px;position:relative;overflow:hidden;animation:ac-s-in .6s ease-out both;animation-delay:.3s">
          <svg width="200" height="32" viewBox="0 0 200 32" style="display:block;animation:ac-s-fade 2s linear infinite">
            <line x1="0" y1="16" x2="200" y2="16" stroke="var(--ac-hair)" stroke-width="1"/>
            <path d="M0 16 L40 16 L50 16 L56 4 L64 28 L72 10 L80 16 L120 16 L130 16 L136 4 L144 28 L152 10 L160 16 L200 16"
              fill="none" stroke="var(--ac-accent)" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="260" stroke-dashoffset="260"
              style="animation:ac-s-trace 2s linear infinite"/>
          </svg>
        </div>

        <!-- Phase label -->
        <div style="
          margin-top:16px;
          font-family:'JetBrains Mono',monospace;
          font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
          color:var(--ac-dim);
          animation:ac-s-in .6s ease-out both;animation-delay:.45s;
        ">initializing</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
