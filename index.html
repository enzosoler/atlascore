<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/x-icon" href="/branding/dark/favicon.ico" sizes="any" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/branding/dark/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="atlas.core" />
    <meta id="app-theme-color" name="theme-color" content="#05070A" />
    <meta
      name="description"
      content="atlas.core is the performance operating system for workouts, nutrition, measurements, supplements, and real-world progress."
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:site_name" content="atlas.core" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="atlas.core" />
    <meta
      property="og:description"
      content="atlas.core is the performance operating system for workouts, nutrition, measurements, supplements, and real-world progress."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="atlas.core" />
    <meta
      name="twitter:description"
      content="atlas.core is the performance operating system for workouts, nutrition, measurements, supplements, and real-world progress."
    />
    <link rel="canonical" href="/" />
    <link rel="manifest" href="/manifest.json" />
    <title>atlas.core</title>
    <script>
      (function () {
        var THEME_KEY = 'atlas-theme';
        var THEME_EXPLICIT_KEY = 'atlas-theme-explicit';
        var DEFAULT_THEME = 'dark';
        var root = document.documentElement;
        var storedTheme = localStorage.getItem(THEME_KEY);
        var hasExplicitPreference = localStorage.getItem(THEME_EXPLICIT_KEY) === 'true';
        var theme =
          hasExplicitPreference && (storedTheme === 'dark' || storedTheme === 'light')
            ? storedTheme
            : DEFAULT_THEME;
        var isDark = theme === 'dark';
        var favicon = document.getElementById('app-favicon');
        var appleTouchIcon = document.getElementById('app-apple-touch-icon');
        var themeColor = document.getElementById('app-theme-color');

        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);

        if (favicon) favicon.setAttribute('href', isDark ? '/branding/dark/favicon.ico' : '/branding/light/favicon.ico');
        if (appleTouchIcon) appleTouchIcon.setAttribute('href', isDark ? '/branding/dark/apple-touch-icon.png' : '/branding/light/apple-touch-icon.png');
        if (themeColor) themeColor.setAttribute('content', isDark ? '#05070A' : '#FFFFFF');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
