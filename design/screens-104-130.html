<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>atlas.core - Screens 104-130</title>
  <style>
    :root {
      --bg: #080E0E;
      --card: #111A1A;
      --card2: #0D1515;
      --border: #1E2C2C;
      --teal: #4A9B9B;
      --teal-dim: rgba(74,155,155,0.12);
      --teal-mid: rgba(74,155,155,0.22);
      --white: #FFFFFF;
      --secondary: #8A9A9A;
      --red: #E05C5C;
      --red-dim: rgba(224,92,92,0.12);
      --green: #4CAF7D;
      --green-dim: rgba(76,175,125,0.12);
      --amber: #E0A84A;
      --sheet: #0B1111;
      --shadow: 0 30px 70px rgba(0,0,0,0.62);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at top left, rgba(74,155,155,0.08), transparent 24%),
        radial-gradient(circle at top right, rgba(76,175,125,0.05), transparent 18%),
        linear-gradient(180deg, #050909 0%, #050808 100%);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      padding: 32px 20px 48px;
    }

    .page-header {
      max-width: 1240px;
      margin: 0 auto 28px;
      padding: 12px 4px 24px;
      text-align: center;
    }
    .app-icon {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      margin: 0 auto 14px;
      background: linear-gradient(180deg, #101919, #0C1212);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }
    .app-icon .mark {
      width: 42px;
      height: 42px;
      border: 2px solid var(--white);
      border-radius: 12px;
      position: relative;
      transform: rotate(8deg);
      opacity: 0.96;
    }
    .app-icon .mark::before,
    .app-icon .mark::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 999px;
    }
    .app-icon .mark::after {
      inset: 16px 8px;
      border-radius: 12px;
      transform: rotate(-35deg);
    }
    .page-eyebrow {
      color: var(--teal);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
      margin: 0 0 10px;
    }
    .page-title {
      font-size: clamp(32px, 2.4rem + 1vw, 46px);
      line-height: 1.02;
      letter-spacing: -0.06em;
      margin: 0;
      font-weight: 800;
    }
    .page-copy {
      max-width: 760px;
      margin: 14px auto 0;
      color: var(--secondary);
      font-size: 15px;
      line-height: 1.6;
    }

    .gallery {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 26px;
      align-items: start;
    }

    .screen-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .screen-label {
      text-align: center;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .phone {
      width: 360px;
      height: 780px;
      border-radius: 46px;
      border: 1.5px solid rgba(255,255,255,0.06);
      background: #000;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.04) inset;
      display: flex;
      flex-direction: column;
    }
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 34px;
      background: #050909;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      z-index: 20;
    }
    .screen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 44px;
      padding: 10px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      font-size: 14px;
      font-weight: 600;
      color: var(--white);
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .signal, .wifi, .battery {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
    }
    .signal span {
      width: 3px;
      background: var(--white);
      border-radius: 2px;
      display: block;
    }
    .signal span:nth-child(1) { height: 5px; opacity: 0.42; }
    .signal span:nth-child(2) { height: 7px; opacity: 0.62; }
    .signal span:nth-child(3) { height: 9px; opacity: 0.82; }
    .signal span:nth-child(4) { height: 11px; }
    .wifi svg, .battery svg { display: block; }

    .nav {
      padding: 2px 16px 10px;
      flex-shrink: 0;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--teal);
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .back .chev {
      width: 8px;
      height: 8px;
      border-left: 2px solid var(--teal);
      border-bottom: 2px solid var(--teal);
      transform: rotate(45deg);
      margin-left: 2px;
    }
    .nav-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }
    .nav-title {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1.06;
      color: var(--white);
    }
    .nav-subtitle {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--secondary);
      line-height: 1.45;
    }

    .body {
      flex: 1;
      overflow: hidden;
      overflow-y: auto;
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: none;
    }
    .body::-webkit-scrollbar { width: 0; height: 0; }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 16px 10px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { width: 0; height: 0; }
    .tab {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(17,26,26,0.86);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--teal-dim);
      border-color: rgba(74,155,155,0.28);
      color: var(--teal);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .card.soft {
      background: linear-gradient(180deg, rgba(17,26,26,0.94), rgba(13,21,21,0.94));
    }
    .card.tight { padding: 12px; }
    .card.sheet {
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(15,22,22,0.98), rgba(11,17,17,0.98));
    }

    .section {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 2px 0;
    }
    .eyebrow {
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-bottom: 6px;
    }
    .section h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: -0.03em;
    }
    .section p {
      margin: 4px 0 0;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .teal {
      color: var(--teal);
      background: var(--teal-dim);
      border-color: rgba(74,155,155,0.22);
    }
    .green {
      color: var(--green);
      background: var(--green-dim);
      border-color: rgba(76,175,125,0.22);
    }
    .red {
      color: var(--red);
      background: var(--red-dim);
      border-color: rgba(224,92,92,0.2);
    }
    .gray {
      color: var(--secondary);
      background: rgba(138,154,154,0.12);
      border-color: rgba(138,154,154,0.18);
    }
    .amber {
      color: var(--amber);
      background: rgba(224,168,74,0.12);
      border-color: rgba(224,168,74,0.2);
    }

    .icon {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.01em;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--secondary);
    }
    .icon.teal {
      background: var(--teal-dim);
      color: var(--teal);
      border-color: rgba(74,155,155,0.22);
    }
    .icon.green {
      background: var(--green-dim);
      color: var(--green);
      border-color: rgba(76,175,125,0.22);
    }
    .icon.red {
      background: var(--red-dim);
      color: var(--red);
      border-color: rgba(224,92,92,0.22);
    }
    .icon.gray {
      background: rgba(138,154,154,0.12);
      color: var(--secondary);
      border-color: rgba(138,154,154,0.16);
    }
    .icon.big {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      font-size: 20px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .metric {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      min-height: 94px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .metric .label {
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .metric .value {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.08em;
      font-family: "SF Mono", ui-monospace, monospace;
      line-height: 1;
    }
    .metric .sub {
      color: var(--secondary);
      font-size: 11px;
      line-height: 1.35;
    }
    .spark {
      height: 30px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }
    .spark span {
      width: 8px;
      border-radius: 999px 999px 3px 3px;
      background: linear-gradient(180deg, rgba(74,155,155,0.9), rgba(74,155,155,0.25));
    }
    .spark.green span { background: linear-gradient(180deg, rgba(76,175,125,0.9), rgba(76,175,125,0.28)); }
    .spark.red span { background: linear-gradient(180deg, rgba(224,92,92,0.9), rgba(224,92,92,0.28)); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
    }
    .row + .row { border-top: 1px solid var(--border); }
    .row.compact { padding: 10px 0; }
    .row .left {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .row .title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .row .meta {
      margin: 3px 0 0;
      font-size: 11px;
      color: var(--secondary);
      line-height: 1.35;
    }
    .row .right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      text-align: right;
    }
    .row .right .stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .pill-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 999px;
      overflow: hidden;
    }
    .pill-toggle span {
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--secondary);
    }
    .pill-toggle .active {
      background: var(--teal-dim);
      color: var(--teal);
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn.primary {
      background: var(--teal);
      color: var(--white);
      box-shadow: 0 8px 22px rgba(74,155,155,0.22);
    }
    .btn.secondary {
      background: transparent;
      border-color: rgba(74,155,155,0.35);
      color: var(--teal);
    }
    .btn.destructive {
      background: var(--red);
      color: var(--white);
    }
    .btn.ghost {
      background: transparent;
      color: var(--secondary);
      border-color: var(--border);
    }

    .input {
      height: 46px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--secondary);
      font-size: 13px;
    }
    .input.focus {
      border-color: rgba(74,155,155,0.5);
      box-shadow: 0 0 0 3px rgba(74,155,155,0.08);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }
    .progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(138,154,154,0.12);
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(74,155,155,0.9), rgba(74,155,155,0.55));
    }
    .progress.green > span {
      background: linear-gradient(90deg, rgba(76,175,125,0.9), rgba(76,175,125,0.6));
    }
    .progress.red > span {
      background: linear-gradient(90deg, rgba(224,92,92,0.9), rgba(224,92,92,0.6));
    }

    .sheet {
      border-radius: 20px;
      background: var(--sheet);
      border: 1px solid var(--border);
      padding: 16px;
    }
    .sheet-handle {
      width: 44px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      margin: 0 auto 12px;
    }

    .empty-state {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 22px 16px 18px;
      gap: 14px;
    }
    .empty-state h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.05em;
      line-height: 1.15;
    }
    .empty-state p {
      margin: 0;
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.55;
      max-width: 24ch;
    }

    .overlay-phone {
      background:
        radial-gradient(circle at 50% 18%, rgba(74,155,155,0.12), transparent 24%),
        linear-gradient(180deg, rgba(4,8,8,0.88), rgba(4,8,8,0.96));
    }
    .blur-card {
      background: rgba(17,26,26,0.86);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: linear-gradient(90deg, #111a1a 0%, #132020 50%, #111a1a 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .sk-line {
      height: 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
    }
    .sk-box { border-radius: 14px; background: rgba(255,255,255,0.05); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .center { display: flex; align-items: center; justify-content: center; text-align: center; }
    .muted { color: var(--secondary); }
    .mono { font-family: "SF Mono", ui-monospace, monospace; }
    .small { font-size: 11px; }

    .chart {
      height: 88px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(17,26,26,0.92), rgba(13,21,21,0.92));
      padding: 12px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .chart span {
      flex: 1;
      border-radius: 999px 999px 4px 4px;
      background: linear-gradient(180deg, rgba(74,155,155,0.9), rgba(74,155,155,0.14));
    }

    .list-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 2px;
      margin-bottom: 4px;
    }
    .list-title h4 {
      margin: 0;
      font-size: 12px;
      color: var(--secondary);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .hint {
      border-radius: 999px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
    }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .compare .comp {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    .compare .comp strong {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .compare .comp p {
      margin: 0;
      color: var(--secondary);
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="app-icon"><div class="mark"></div></div>
    <p class="page-eyebrow">atlas.core</p>
    <h1 class="page-title">Admin, pricing, notifications, help, and edge states</h1>
    <p class="page-copy">
      Screens 104-130 rendered as a dark-mode-first iOS mockup gallery using the atlas.core design system:
      SF Pro feel, muted teal accent, strong card hierarchy, premium sheets, and deliberate system states.
    </p>
  </header>

  <main id="gallery" class="gallery"></main>

  <script>
    const tabs = [
      { id: 'today', label: 'Today' },
      { id: 'train', label: 'Train' },
      { id: 'nutrition', label: 'Nutrition' },
      { id: 'body', label: 'Body' },
      { id: 'more', label: 'More' },
    ];

    const tabBar = (active = 'more') => `
      <div class="tabs">
        ${tabs.map((tab) => `<span class="tab ${tab.id === active ? 'active' : ''}">${tab.label}</span>`).join('')}
      </div>
    `;

    const statusBar = () => `
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
          <div class="signal"><span></span><span></span><span></span><span></span></div>
          <div class="wifi">
            <svg width="15" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
              <path d="M8 10.8a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z" fill="white" opacity="0.92"/>
              <path d="M4.5 7.2a5 5 0 0 1 7 0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M1.5 4a9 9 0 0 1 13 0" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.42"/>
            </svg>
          </div>
          <div class="battery">
            <svg width="26" height="12" viewBox="0 0 26 12" fill="none" aria-hidden="true">
              <rect x="0.75" y="0.75" width="21" height="10.5" rx="3.25" stroke="white" stroke-opacity="0.35"/>
              <rect x="2.15" y="2.15" width="17.1" height="7.7" rx="2.2" fill="white"/>
              <rect x="22.2" y="4" width="2.2" height="4" rx="1" fill="white" opacity="0.4"/>
            </svg>
          </div>
        </div>
      </div>
    `;

    const shell = ({ title, subtitle = '', back = '', activeTab = 'more', body, after = '', centered = false, noNav = false, overlay = false }) => `
      <div class="phone ${overlay ? 'overlay-phone' : ''}">
        <div class="notch"></div>
        <div class="screen">
          ${statusBar()}
          ${noNav ? '' : `
            <div class="nav">
              ${back ? `<div class="back"><span class="chev"></span>${back}</div>` : ''}
              <div class="nav-top">
                <div>
                  <h2 class="nav-title">${title}</h2>
                  ${subtitle ? `<p class="nav-subtitle">${subtitle}</p>` : ''}
                </div>
                ${after || ''}
              </div>
            </div>
          `}
          ${body}
          ${activeTab ? tabBar(activeTab) : ''}
          <div style="height: 10px;"></div>
        </div>
      </div>
    `;

    function guideScreen({ title, subtitle, steps, note, cta = 'Open guide' }) {
      return shell({

            </div>
            <div class="card">
              ${steps.map((step, index) => row({
                iconLabel: String(index + 1),
                iconTone: index === 0 ? 'teal' : index === steps.length - 1 ? 'green' : 'gray',
                title: step.title,
                meta: step.meta,
                right: step.badge ? badge(step.badge.text, step.badge.tone) : ''

            </div>
            <div class="card">
              ${section({ eyebrow: 'Next step', title: 'Keep the context close.', text: stepNoteMap(title) })}

      return 'The user should understand what was prescribed, what was done, and why the difference matters.';
