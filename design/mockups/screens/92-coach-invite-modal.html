<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>92 · Coach — Invite Modal · atlas.core</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  :root {
    --bg: #080E0E; --card: #111A1A; --card-hi: #162020; --border: #1E2C2C;
    --teal: #4A9B9B; --teal-dim: rgba(74,155,155,0.12); --teal-mid: rgba(74,155,155,0.22);
    --white: #FFFFFF; --sub: #8A9A9A;
    --ok: #4CAF7D; --ok-dim: rgba(76,175,125,0.12);
    --warn: #E8A838; --warn-dim: rgba(232,168,56,0.12);
    --err: #E05C5C; --err-dim: rgba(224,92,92,0.12);
  }
  body {
    background: #1a1a1a; display: flex; justify-content: center;
    align-items: flex-start; min-height: 100vh; padding: 40px 20px;
    font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif;
  }
  .phone {
    width: 375px; height: 812px; background: var(--bg);
    border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 40px 120px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
  }

  /* Background content (blurred) */
  .bg-content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    filter: blur(2px); opacity: 0.4;
    pointer-events: none;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px 0; height: 44px;
  }
  .status-time { font-size: 15px; font-weight: 600; color: var(--white); letter-spacing: -0.3px; }
  .bg-nav { padding: 8px 20px; }
  .bg-title { font-size: 34px; font-weight: 700; color: var(--white); letter-spacing: -0.8px; }

  /* Overlay */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(4, 8, 8, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* Bottom Sheet */
  .sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 0 0 40px;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
  }

  /* Drag handle */
  .drag-handle {
    display: flex; justify-content: center; padding: 12px 0 8px;
  }
  .drag-bar {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--border);
  }

  /* Sheet Header */
  .sheet-header {
    padding: 4px 20px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .sheet-title { font-size: 22px; font-weight: 700; color: var(--white); letter-spacing: -0.5px; }
  .sheet-sub { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .close-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.07); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; margin-top: 2px;
    color: var(--sub);
  }

  /* Form body */
  .form-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  /* Field */
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: 0.04em; text-transform: uppercase; }
  .field-input {
    background: var(--card-hi); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 16px;
    font-size: 15px; color: var(--white); font-family: inherit;
    outline: none; transition: border-color 0.15s;
    width: 100%;
  }
  .field-input.focused { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(74,155,155,0.12); }
  .field-input::placeholder { color: var(--sub); }
  textarea.field-input { resize: none; height: 90px; line-height: 1.5; }

  /* Role field (locked/display) */
  .role-display {
    background: var(--card-hi); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .role-value { font-size: 15px; color: var(--white); }
  .role-lock {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--sub);
  }

  /* Helper text */
  .helper { font-size: 12px; color: var(--sub); line-height: 1.5; }
  .helper strong { color: var(--teal); }

  /* Divider */
  .divider { height: 1px; background: var(--border); }

  /* Actions */
  .actions { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
  .btn-primary {
    width: 100%; background: var(--teal); color: var(--white);
    border: none; border-radius: 12px; padding: 15px 20px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    font-family: inherit; letter-spacing: -0.2px;
    box-shadow: 0 4px 20px rgba(74,155,155,0.35);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-cancel {
    width: 100%; background: transparent; color: var(--sub);
    border: none; border-radius: 12px; padding: 13px 20px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }

  /* Chips for recent */
  .recents { display: flex; gap: 8px; flex-wrap: wrap; }
  .recent-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--card-hi); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px;
    font-size: 12px; color: var(--sub); cursor: pointer;
  }
  .recent-initial {
    width: 18px; height: 18px; border-radius: 5px;
    background: var(--teal-dim); color: var(--teal);
    font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- Background (blurred) -->
  <div class="bg-content">
    <div class="status-bar">
      <span class="status-time">9:41</span>
    </div>
    <div class="bg-nav">
      <div class="bg-title">Students</div>
    </div>
  </div>

  <!-- Dimming overlay -->
  <div class="overlay"></div>

  <!-- Bottom Sheet -->
  <div class="sheet">
    <div class="drag-handle"><div class="drag-bar"></div></div>

    <!-- Header -->
    <div class="sheet-header">
      <div>
        <div class="sheet-title">Invite Student</div>
        <div class="sheet-sub">They'll receive an email to join your squad</div>
      </div>
      <button class="close-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Form -->
    <div class="form-body">

      <!-- Email -->
      <div class="field">
        <div class="field-label">Email address</div>
        <input class="field-input focused" type="email" placeholder="student@email.com" value="">
      </div>

      <!-- Recents -->
      <div class="field">
        <div class="field-label">Recent</div>
        <div class="recents">
          <div class="recent-chip"><div class="recent-initial">L</div>lena.k@email.com</div>
          <div class="recent-chip"><div class="recent-initial">P</div>paulo.s@email.com</div>
        </div>
      </div>

      <!-- Role -->
      <div class="field">
        <div class="field-label">Role</div>
        <div class="role-display">
          <span class="role-value">Student</span>
          <div class="role-lock">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Locked
          </div>
        </div>
      </div>

      <!-- Message -->
      <div class="field">
        <div class="field-label">Personal message <span style="color:#1E2C2C;font-weight:400;">· Optional</span></div>
        <textarea class="field-input" placeholder="Hey! I'll be your coach on Atlas. Looking forward to working together…"></textarea>
      </div>

      <!-- Helper -->
      <div class="helper">
        The student will see your name as <strong>Coach Enzo</strong> and can accept or decline the invite.
      </div>

    </div>

    <div class="divider"></div>

    <!-- Actions -->
    <div class="actions" style="padding-top:16px;">
      <button class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send Invite
      </button>
      <button class="btn-cancel">Cancel</button>
    </div>

  </div><!-- /sheet -->

</div><!-- /phone -->
</body>
</html>
