<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>atlas.core — toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --paper: #efe9da;
    --accent: #e8b500;
    --card: #f4efde;
    --card2: #ebe4cd;
    --hair: rgba(10,10,10,0.08);
    --line: rgba(10,10,10,0.14);
    --dim: rgba(10,10,10,0.56);
    --mute: rgba(10,10,10,0.42);
    --faint: rgba(10,10,10,0.22);
    --display: -apple-system, "SF Pro Display", "SF Pro", system-ui, sans-serif;
    --body:    -apple-system, "SF Pro Text", "SF Pro", "Inter", system-ui, sans-serif;
    --mono:    ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --brand:   "Archivo Black", "Arial Black", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--body); }
  #root { max-width: 1280px; margin: 0 auto; padding: 56px 48px 120px; }
  @media print {
    #root { max-width: none; padding: 24px; }
    .page-break { page-break-before: always; }
    .no-print { display: none !important; }
  }

  /* ---- motion helpers (used by #4) ---- */
  @keyframes ac-countup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes ac-ring    { from { stroke-dashoffset: 565; } to { stroke-dashoffset: 102; } } /* 565 = 2πr at r=90; leaves ~82% */
  @keyframes ac-ecg     { from { stroke-dashoffset: 800; } to { stroke-dashoffset: 0; } }
  @keyframes ac-tick    { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes ac-pulse   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes ac-sheet   { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes ac-tabswap { 0% { opacity: 0; transform: translateX(16px); } 100% { opacity: 1; transform: translateX(0); } }
  @keyframes ac-flash   { 0%,100% { background: transparent; } 40% { background: var(--accent); } }
  @keyframes ac-bar     { from { width: 0; } to { width: var(--w, 60%); } }
  @keyframes ac-ecg-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="toolkit-parts.jsx"></script>
<script type="text/babel" src="toolkit-app.jsx"></script>

</body>
</html>
