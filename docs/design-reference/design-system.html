<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>atlas.core — design system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --paper: #efe9da;
    --accent: #e8b500;
    --card: #f4efde;
    --card2: #ebe4cd;
    --hair: rgba(10,10,10,0.08);
    --dim: rgba(10,10,10,0.56);
    --mute: rgba(10,10,10,0.42);
    --faint: rgba(10,10,10,0.22);
    --display: -apple-system, "SF Pro Display", "SF Pro", system-ui, sans-serif;
    --body:    -apple-system, "SF Pro Text", "SF Pro", "Inter", system-ui, sans-serif;
    --mono:    ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --brand:   "Archivo Black", "Arial Black", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--body); }
  #root { max-width: 1240px; margin: 0 auto; padding: 56px 48px 120px; }

  @media print {
    #root { max-width: none; padding: 24px; }
    .page-break { page-break-before: always; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ds-parts.jsx"></script>
<script type="text/babel" src="ds-app.jsx"></script>

</body>
</html>
