<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>33 · Rest Timer — atlas.core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  :root {
    --bg: #080E0E;
    --card: #111A1A;
    --border: #1E2C2C;
    --teal: #4A9B9B;
    --teal-dim: rgba(74,155,155,0.10);
    --white: #FFFFFF;
    --secondary: #8A9A9A;
    --red: #E05C5C;
    --green: #4CAF7D;
    --r-card: 14px;
    --r-btn: 10px;
  }

  body {
    width: 375px;
    height: 812px;
    background: var(--bg);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    color: var(--white);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ─── BLURRED BACKGROUND EXERCISE ─── */
  .bg-exercise-layer {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,14,14,0.0) 0%, rgba(8,14,14,0.92) 55%, rgba(8,14,14,1) 100%);
    z-index: 0;
  }
  /* subtle background content showing through (the execution screen underneath) */
  .bg-hint {
    position: absolute;
    top: 80px;
    left: 20px;
    right: 20px;
    opacity: 0.07;
    z-index: 0;
  }
  .bg-hint-label { font-size: 28px; font-weight: 700; letter-spacing: -1px; color: var(--white); }

  /* ─── STATUS BAR ─── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px 0;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .status-time { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: var(--white); }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* ─── REST LABEL ─── */
  .rest-label-section {
    padding: 36px 20px 0;
    text-align: center;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .rest-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(74,155,155,0.12);
    border: 1px solid rgba(74,155,155,0.2);
    border-radius: 20px;
    padding: 6px 14px;
    margin-bottom: 6px;
  }
  .rest-badge-dot {
    width: 6px;
    height: 6px;
    background: var(--teal);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .rest-badge-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .set-complete-label {
    font-size: 15px;
    color: var(--secondary);
    font-weight: 400;
  }
  .set-complete-label strong { color: var(--white); font-weight: 600; }

  /* ─── RING TIMER ─── */
  .ring-section {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    flex-direction: column;
    padding-top: 16px;
  }
  .ring-wrapper {
    position: relative;
    width: 240px;
    height: 240px;
  }
  .ring-svg {
    width: 240px;
    height: 240px;
    transform: rotate(-90deg);
    position: absolute;
    top: 0;
    left: 0;
  }
  /* track ring */
  .ring-track {
    fill: none;
    stroke: var(--border);
    stroke-width: 6;
  }
  /* progress ring */
  .ring-progress {
    fill: none;
    stroke: var(--teal);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 688.4; /* 2π × 109.6 */
    stroke-dashoffset: 172;  /* ~75% filled = 25% remaining = 690 * 0.25 = 172 */
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 8px rgba(74,155,155,0.5));
  }
  /* glow ring */
  .ring-glow {
    fill: none;
    stroke: var(--teal);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 688.4;
    stroke-dashoffset: 172;
    opacity: 0.12;
    filter: blur(4px);
  }
  /* inner content */
  .ring-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .ring-time {
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -4px;
    color: var(--white);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .ring-time-label {
    font-size: 13px;
    color: var(--secondary);
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* adjust buttons around ring */
  .ring-adjusters {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 28px;
  }
  .adj-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .adj-circle {
    width: 52px;
    height: 52px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s;
  }
  .adj-btn:active .adj-circle { border-color: var(--teal); }
  .adj-text {
    font-size: 11px;
    font-weight: 600;
    color: var(--secondary);
    letter-spacing: 0.2px;
  }

  /* ─── NEXT SET PREVIEW ─── */
  .next-set-section {
    margin: 0 20px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .next-set-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .next-set-icon {
    width: 36px;
    height: 36px;
    background: var(--teal-dim);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .next-set-info { flex: 1; }
  .next-set-eyebrow {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--teal);
    margin-bottom: 2px;
  }
  .next-set-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.3px;
  }
  .next-set-detail {
    font-size: 12px;
    color: var(--secondary);
    margin-top: 1px;
  }
  .next-set-target {
    text-align: right;
    flex-shrink: 0;
  }
  .target-val {
    font-family: -apple-system, 'SF Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .target-label {
    font-size: 10px;
    color: var(--secondary);
    font-weight: 500;
  }

  /* ─── ACTION BUTTONS ─── */
  .action-section {
    padding: 14px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .btn-skip {
    width: 100%;
    height: 56px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--r-btn);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .btn-skip:active { border-color: var(--teal); }
  .btn-skip-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--secondary);
    letter-spacing: -0.2px;
  }
  .btn-add-set {
    width: 100%;
    height: 44px;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
  }
  .btn-add-set-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--secondary);
  }

  /* ─── HOME INDICATOR ─── */
  .home-indicator {
    height: 34px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .home-bar {
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.18);
    border-radius: 3px;
  }

  /* ─── ANIMATE TIMER ─── */
  @keyframes countdown {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: 688; }
  }
  .ring-progress {
    animation: none;
  }
</style>
</head>
<body>

<!-- BACKGROUND HINT (exercise screen showing through) -->
<div class="bg-exercise-layer"></div>
<div class="bg-hint">
  <div class="bg-hint-label">Bench Press</div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
      <rect x="0" y="3" width="3" height="9" rx="1" fill="white"/>
      <rect x="4.5" y="2" width="3" height="10" rx="1" fill="white"/>
      <rect x="9" y="0" width="3" height="12" rx="1" fill="white"/>
      <rect x="13.5" y="0" width="3" height="12" rx="1" fill="white" opacity="0.3"/>
    </svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
      <path d="M8 2.5C10.3 2.5 12.4 3.5 13.8 5.1L15.2 3.7C13.4 1.8 10.8 0.5 8 0.5C5.2 0.5 2.6 1.8 0.8 3.7L2.2 5.1C3.6 3.5 5.7 2.5 8 2.5Z" fill="white"/>
      <path d="M8 5.5C9.5 5.5 10.9 6.1 11.9 7.1L13.3 5.7C12 4.4 10.1 3.5 8 3.5C5.9 3.5 4 4.4 2.7 5.7L4.1 7.1C5.1 6.1 6.5 5.5 8 5.5Z" fill="white"/>
      <circle cx="8" cy="10" r="2" fill="white"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
      <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/>
      <rect x="2" y="2" width="16" height="8" rx="2" fill="white"/>
      <path d="M23 4.5V7.5C23.8 7.2 24.5 6.5 24.5 6C24.5 5.5 23.8 4.8 23 4.5Z" fill="white" opacity="0.4"/>
    </svg>
  </div>
</div>

<!-- REST LABEL -->
<div class="rest-label-section">
  <div class="rest-badge">
    <div class="rest-badge-dot"></div>
    <span class="rest-badge-text">Resting</span>
  </div>
  <div style="height: 8px;"></div>
  <p class="set-complete-label">Set 3 done — <strong>80kg × 8</strong></p>
</div>

<!-- RING TIMER -->
<div class="ring-section">
  <div class="ring-wrapper">
    <svg class="ring-svg" viewBox="0 0 240 240">
      <!-- Track -->
      <circle class="ring-track" cx="120" cy="120" r="109.6"/>
      <!-- Glow -->
      <circle class="ring-glow" cx="120" cy="120" r="109.6" style="stroke-dashoffset: 172;"/>
      <!-- Progress -->
      <circle class="ring-progress" cx="120" cy="120" r="109.6"/>
    </svg>
    <div class="ring-inner">
      <span class="ring-time">0:67</span>
      <span class="ring-time-label">seconds remaining</span>
    </div>
  </div>

  <!-- ADJUST BUTTONS -->
  <div class="ring-adjusters">
    <div class="adj-btn">
      <div class="adj-circle">
        <svg width="22" height="14" viewBox="0 0 22 14" fill="none">
          <text x="1" y="12" font-family="-apple-system, SF Pro Text" font-size="12" font-weight="700" fill="#8A9A9A">−15</text>
        </svg>
      </div>
      <span class="adj-text">−15s</span>
    </div>

    <div style="width:1px; height:28px; background: var(--border);"></div>

    <div class="adj-btn">
      <div class="adj-circle">
        <svg width="22" height="14" viewBox="0 0 22 14" fill="none">
          <text x="0" y="12" font-family="-apple-system, SF Pro Text" font-size="12" font-weight="700" fill="#8A9A9A">+15</text>
        </svg>
      </div>
      <span class="adj-text">+15s</span>
    </div>
  </div>
</div>

<!-- NEXT SET PREVIEW -->
<div class="next-set-section">
  <div class="next-set-card">
    <div class="next-set-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M3.5 9H14.5M14.5 9L10.5 5M14.5 9L10.5 13" stroke="#4A9B9B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="next-set-info">
      <div class="next-set-eyebrow">Next Set</div>
      <div class="next-set-name">Bench Press</div>
      <div class="next-set-detail">Set 4 of 4 · Last set</div>
    </div>
    <div class="next-set-target">
      <div class="target-val">80<span style="font-size:13px;font-weight:500;color:#8A9A9A;">kg</span></div>
      <div class="target-label">× 8 reps</div>
    </div>
  </div>
</div>

<!-- ACTION BUTTONS -->
<div class="action-section">
  <div class="btn-skip">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M3 2L11 7L3 12V2Z" fill="#8A9A9A"/>
      <path d="M11 2V12" stroke="#8A9A9A" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="btn-skip-text">Skip Rest</span>
  </div>
  <div class="btn-add-set">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M6 1V11M1 6H11" stroke="#8A9A9A" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span class="btn-add-set-text">Add set to this exercise</span>
  </div>
</div>

<!-- HOME INDICATOR -->
<div class="home-indicator">
  <div class="home-bar"></div>
</div>

</body>
</html>
