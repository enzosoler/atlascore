<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>34 · Workout Complete — atlas.core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  :root {
    --bg: #080E0E;
    --card: #111A1A;
    --border: #1E2C2C;
    --teal: #4A9B9B;
    --teal-dim: rgba(74,155,155,0.10);
    --teal-glow: rgba(74,155,155,0.14);
    --white: #FFFFFF;
    --secondary: #8A9A9A;
    --red: #E05C5C;
    --green: #4CAF7D;
    --green-dim: rgba(76,175,125,0.10);
    --r-card: 14px;
    --r-btn: 10px;
  }

  body {
    width: 375px;
    height: 812px;
    background: var(--bg);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    color: var(--white);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ─── AMBIENT GLOW ─── */
  .ambient-glow {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 320px;
    background: radial-gradient(ellipse at center, rgba(74,155,155,0.14) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .ambient-glow-2 {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    background: radial-gradient(ellipse at center, rgba(76,175,125,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── STATUS BAR ─── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px 0;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .status-time { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: var(--white); }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* ─── HERO ─── */
  .hero-section {
    padding: 28px 20px 0;
    text-align: center;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .check-ring {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    position: relative;
  }
  .check-ring-svg {
    width: 72px;
    height: 72px;
    position: absolute;
    top: 0;
    left: 0;
    transform: rotate(-90deg);
  }
  .check-ring-track {
    fill: none;
    stroke: var(--border);
    stroke-width: 2.5;
  }
  .check-ring-fill {
    fill: none;
    stroke: var(--green);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 201;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 6px rgba(76,175,125,0.5));
  }
  .check-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green-dim);
    border-radius: 50%;
  }
  .complete-eyebrow {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--green);
    margin-bottom: 6px;
  }
  .complete-title {
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1.4px;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .complete-subtitle {
    font-size: 15px;
    color: var(--secondary);
    font-weight: 400;
  }
  .complete-subtitle strong { color: var(--white); font-weight: 600; }

  /* ─── DURATION HERO STAT ─── */
  .duration-stat {
    margin: 18px 20px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .duration-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--secondary);
  }
  .duration-value {
    font-family: -apple-system, 'SF Mono', monospace;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -2px;
    color: var(--white);
    font-variant-numeric: tabular-nums;
  }
  .duration-sep {
    width: 1px;
    height: 36px;
    background: var(--border);
  }
  .duration-sub {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .pb-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(76,175,125,0.12);
    border: 1px solid rgba(76,175,125,0.2);
    border-radius: 20px;
    padding: 2px 8px;
  }
  .pb-badge-text { font-size: 10px; font-weight: 700; color: var(--green); letter-spacing: 0.3px; }

  /* ─── STATS GRID ─── */
  .stats-grid {
    margin: 10px 20px 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .stat-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-cell-icon {
    width: 28px;
    height: 28px;
    background: var(--teal-dim);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
  }
  .stat-cell-value {
    font-family: -apple-system, 'SF Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.8px;
    color: var(--white);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stat-cell-unit {
    font-size: 11px;
    color: var(--secondary);
    font-weight: 500;
  }
  .stat-cell-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--secondary);
    margin-top: 2px;
  }

  /* ─── PRS ─── */
  .prs-section {
    margin: 10px 20px 0;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--secondary);
    margin-bottom: 8px;
  }
  .pr-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .pr-card {
    background: var(--green-dim);
    border: 1px solid rgba(76,175,125,0.15);
    border-radius: var(--r-card);
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pr-icon-wrap {
    width: 30px;
    height: 30px;
    background: rgba(76,175,125,0.15);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pr-info { flex: 1; }
  .pr-exercise {
    font-size: 13px;
    font-weight: 600;
    color: var(--white);
    letter-spacing: -0.2px;
  }
  .pr-type { font-size: 11px; color: var(--green); font-weight: 500; }
  .pr-value {
    font-family: -apple-system, 'SF Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }

  /* ─── RATING ─── */
  .rating-section {
    margin: 10px 20px 0;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .rating-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 14px 16px;
  }
  .rating-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 10px;
  }
  .rating-stars {
    display: flex;
    gap: 8px;
  }
  .star {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .star svg { transition: transform 0.15s; }
  .star:active svg { transform: scale(1.2); }

  /* ─── BOTTOM ACTIONS ─── */
  .bottom-actions {
    padding: 12px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .actions-row {
    display: flex;
    gap: 10px;
  }
  .btn-share {
    flex: 1;
    height: 52px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--r-btn);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .btn-share:active { border-color: var(--teal); }
  .btn-share-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--secondary);
    letter-spacing: -0.2px;
  }
  .btn-done {
    flex: 1.6;
    height: 52px;
    background: var(--teal);
    border: none;
    border-radius: var(--r-btn);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-done:active { opacity: 0.85; }
  .btn-done-text {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }

  /* ─── HOME INDICATOR ─── */
  .home-indicator {
    height: 34px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    margin-top: auto;
  }
  .home-bar {
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.18);
    border-radius: 3px;
  }
</style>
</head>
<body>

<!-- AMBIENT GLOW -->
<div class="ambient-glow"></div>
