<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>32 · Workout Execution — atlas.core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  :root {
    --bg: #080E0E;
    --card: #111A1A;
    --border: #1E2C2C;
    --teal: #4A9B9B;
    --teal-dim: rgba(74,155,155,0.12);
    --teal-glow: rgba(74,155,155,0.18);
    --white: #FFFFFF;
    --secondary: #8A9A9A;
    --red: #E05C5C;
    --green: #4CAF7D;
    --r-card: 14px;
    --r-btn: 10px;
    --r-sheet: 20px;
  }

  body {
    width: 375px;
    height: 812px;
    background: var(--bg);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    color: var(--white);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ─── STATUS BAR ─── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px 0;
    flex-shrink: 0;
  }
  .status-time {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--white);
  }
  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .status-icons svg { opacity: 0.9; }

  /* ─── TOP NAV ─── */
  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px 8px;
    flex-shrink: 0;
  }
  .btn-end {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(224,92,92,0.12);
    border: 1px solid rgba(224,92,92,0.25);
    border-radius: 20px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .btn-end span {
    font-size: 13px;
    font-weight: 600;
    color: var(--red);
    letter-spacing: -0.1px;
  }
  .workout-elapsed {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .elapsed-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--secondary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .elapsed-time {
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--white);
    font-variant-numeric: tabular-nums;
  }
  .btn-more {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-section {
    padding: 4px 20px 0;
    flex-shrink: 0;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .progress-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--secondary);
    letter-spacing: 0.2px;
  }
  .progress-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
  }
  .progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    width: 45%;
    background: var(--teal);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  /* exercise dots */
  .exercise-dots {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .exercise-dot {
    height: 3px;
    border-radius: 2px;
    flex: 1;
  }
  .exercise-dot.done { background: var(--teal); }
  .exercise-dot.active { background: var(--teal); opacity: 0.5; }
  .exercise-dot.pending { background: var(--border); }

  /* ─── EXERCISE HEADER ─── */
  .exercise-header {
    padding: 20px 20px 0;
    flex-shrink: 0;
  }
  .exercise-category {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .category-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--teal);
    background: var(--teal-dim);
    padding: 3px 8px;
    border-radius: 20px;
  }
  .exercise-number {
    font-size: 11px;
    color: var(--secondary);
    font-weight: 500;
  }
  .exercise-name {
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -1.2px;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 4px;
  }
  .exercise-meta-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .muscle-tag {
    font-size: 12px;
    color: var(--secondary);
    font-weight: 400;
  }
  .dot-sep { color: var(--border); font-size: 14px; }

  /* ─── SET TRACKER ─── */
  .set-tracker {
    padding: 16px 20px 0;
    flex-shrink: 0;
  }
  .set-pills {
    display: flex;
    gap: 8px;
  }
  .set-pill {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    transition: background 0.25s;
  }
  .set-pill.completed { background: var(--teal); }
  .set-pill.current {
    background: linear-gradient(90deg, var(--teal) 60%, var(--border) 60%);
  }

  .set-info-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 10px;
  }
  .set-label-big {
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--white);
  }
  .set-of {
    font-size: 14px;
    color: var(--secondary);
    font-weight: 400;
  }
  .prev-set-hint {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
  }
  .prev-hint-label { font-size: 10px; color: var(--secondary); font-weight: 500; }
  .prev-hint-value { font-size: 12px; color: var(--white); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ─── INPUT AREA ─── */
  .input-area {
    padding: 20px 20px 0;
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 12px;
  }
  .input-block {
    flex: 1;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--r-card);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    transition: border-color 0.2s;
    position: relative;
  }
  .input-block.active {
    border-color: var(--teal);
    background: rgba(74,155,155,0.06);
  }
  .input-block-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--secondary);
  }
  .input-value {
    font-family: -apple-system, 'SF Mono', 'Courier New', monospace;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -2px;
    color: var(--white);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .input-block.active .input-value { color: var(--teal); }
  .input-unit {
    font-size: 13px;
    color: var(--secondary);
    font-weight: 500;
    margin-top: 2px;
  }
  .input-stepper {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .step-btn {
    width: 28px;
    height: 28px;
    background: var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .step-btn:active { background: var(--teal); }

  /* ─── NOTES ROW ─── */
  .notes-row {
    padding: 12px 20px 0;
    flex-shrink: 0;
  }
  .notes-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .notes-chip span {
    font-size: 12px;
    color: var(--secondary);
    font-weight: 400;
  }

  /* ─── COMPLETE BTN ─── */
  .complete-section {
    padding: 20px 20px 0;
    flex-shrink: 0;
  }
  .btn-complete {
    width: 100%;
    height: 64px;
    background: var(--teal);
    border: none;
    border-radius: var(--r-btn);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-complete:active { opacity: 0.85; transform: scale(0.98); }
  .btn-complete-text {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }
  .btn-complete-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    font-weight: 500;
    letter-spacing: -0.1px;
  }
  .btn-complete-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  /* ─── UPCOMING EXERCISES ─── */
  .upcoming-section {
    padding: 16px 20px 0;
    flex: 1;
    overflow: hidden;
  }
  .upcoming-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--secondary);
    margin-bottom: 10px;
  }
  .upcoming-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .upcoming-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .upcoming-number {
    width: 26px;
    height: 26px;
    background: var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--secondary);
    flex-shrink: 0;
  }
  .upcoming-info { flex: 1; }
  .upcoming-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    letter-spacing: -0.2px;
  }
  .upcoming-detail {
    font-size: 12px;
    color: var(--secondary);
    margin-top: 1px;
  }
  .upcoming-chevron { color: var(--border); }

  /* ─── HOME INDICATOR ─── */
  .home-indicator {
    height: 34px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    flex-shrink: 0;
  }
  .home-bar {
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.18);
    border-radius: 3px;
  }
</style>
</head>
<body>

<!-- STATUS BAR -->

<!-- PROGRESS BAR -->
