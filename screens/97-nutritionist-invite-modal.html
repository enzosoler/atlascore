<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>97 — Nutritionist Invite Modal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #080E0E; --card: #111A1A; --card-hi: #162020; --border: #1E2C2C;
    --teal: #4A9B9B; --teal-dim: rgba(74,155,155,0.12); --teal-border: rgba(74,155,155,0.25);
    --fg: #FFFFFF; --fg2: #8A9A9A; --fg3: #5A6E6E;
    --ok: #4CAF7D; --ok-dim: rgba(76,175,125,0.12);
    --warn: #E8A838;
  }
  body { background: #0F1414; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  .phone { width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 40px 80px rgba(0,0,0,0.7); }

  /* Blurred bg content (clients list behind) */
  .bg-layer {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    filter: blur(3px);
    opacity: 0.35;
    padding: 54px 20px 0;
  }
  .bg-row {
    height: 72px; margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  /* Status Bar (above blur) */
  .status-bar { position: relative; z-index: 10; height: 54px; padding: 16px 28px 0; display: flex; align-items: center; justify-content: space-between; }
  .status-time { font-size: 15px; font-weight: 600; color: var(--fg); letter-spacing: -0.3px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* Scrim */
  .scrim {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(8,14,14,0.72);
    z-index: 20;
  }

  /* Bottom Sheet */
  .sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--card-hi);
    border-radius: 20px 20px 0 0;
    z-index: 30;
    border-top: 1px solid var(--border);
    padding-bottom: 40px;
  }

  /* Drag Handle */
  .drag-handle { display: flex; justify-content: center; padding: 12px 0 8px; }
  .handle-bar { width: 36px; height: 4px; border-radius: 2px; background: var(--border); }

  /* Sheet Header */
  .sheet-header {
    padding: 0 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-title { font-size: 20px; font-weight: 700; color: var(--fg); letter-spacing: -0.4px; margin-bottom: 4px; }
  .sheet-sub { font-size: 13px; color: var(--fg2); }

  /* Sheet Body */
  .sheet-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

  /* Input */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 11px; font-weight: 600; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.5px; }
  .field-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--fg);
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .field-input.focused {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(74,155,155,0.1);
  }
  .field-input::placeholder { color: var(--fg3); }
  .field-hint { font-size: 11px; color: var(--fg3); }

  /* Permissions Toggle Grid */
  .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .perm-toggle {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
  }
  .perm-toggle.on {
    border-color: var(--teal-border);
    background: var(--teal-dim);
  }
  .toggle-switch {
    width: 30px; height: 18px;
    border-radius: 9px;
    position: relative;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .toggle-switch.off { background: var(--border); }
  .toggle-switch.on { background: var(--teal); }
  .toggle-knob {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: white;
    position: absolute;
    top: 2px;
    transition: left 0.2s;
  }
  .toggle-knob.off { left: 2px; }
  .toggle-knob.on { left: 14px; }
  .perm-text { flex: 1; }
  .perm-label { font-size: 12px; font-weight: 600; color: var(--fg); }
  .perm-sub { font-size: 10px; color: var(--fg2); margin-top: 1px; }

  /* Note row */
  .perm-toggle.full { grid-column: 1 / -1; }

  /* Actions */
  .sheet-actions { padding: 0 24px; display: flex; flex-direction: column; gap: 8px; }

  .btn-primary {
    height: 50px; border-radius: 14px;
    background: var(--teal); color: white;
    font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; border: none;
  }
  .btn-secondary {
    height: 44px; border-radius: 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg2);
    font-size: 14px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- Blurred BG -->
  <div class="bg-layer">
    <div style="height:40px;font-size:26px;font-weight:700;color:white;padding-left:4px">Clients</div>
    <div style="height:10px"></div>
    <div class="bg-row"></div>
    <div class="bg-row"></div>
    <div class="bg-row"></div>
    <div class="bg-row"></div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="white" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="white" opacity="0.6"/><rect x="9" y="0" width="3" height="12" rx="1" fill="white"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="2" fill="white"/></svg>
    </div>
  </div>

  <!-- Scrim -->
  <div class="scrim"></div>

  <!-- Bottom Sheet -->
  <div class="sheet">

    <div class="drag-handle"><div class="handle-bar"></div></div>

    <div class="sheet-header">
      <div class="sheet-title">Invite Client</div>
      <div class="sheet-sub">Send a connection invite to a new client</div>
    </div>

    <div class="sheet-body">

      <!-- Email Input (focused) -->
      <div class="field">
        <div class="field-label">Client Email</div>
        <input class="field-input focused" type="email" value="client@email.com" />
        <div class="field-hint">They'll receive an invite link to accept</div>
      </div>

      <!-- Name (Optional) -->
      <div class="field">
        <div class="field-label">Display Name <span style="color:var(--fg3); font-weight:400; font-size:10px">(optional)</span></div>
        <input class="field-input" type="text" placeholder="e.g. João da Silva" />
      </div>

      <!-- Permissions -->
      <div class="field">
        <div class="field-label">Access Permissions</div>
        <div class="perm-grid">
          <div class="perm-toggle on">
            <div class="toggle-switch on"><div class="toggle-knob on"></div></div>
            <div class="perm-text">
              <div class="perm-label">Food Logs</div>
              <div class="perm-sub">View meals</div>
            </div>
          </div>
          <div class="perm-toggle on">
            <div class="toggle-switch on"><div class="toggle-knob on"></div></div>
            <div class="perm-text">
              <div class="perm-label">Diet Plans</div>
              <div class="perm-sub">Create & edit</div>
            </div>
          </div>
          <div class="perm-toggle on">
            <div class="toggle-switch on"><div class="toggle-knob on"></div></div>
            <div class="perm-text">
              <div class="perm-label">Body Data</div>
              <div class="perm-sub">Measurements</div>
            </div>
          </div>
          <div class="perm-toggle">
            <div class="toggle-switch off"><div class="toggle-knob off"></div></div>
            <div class="perm-text">
              <div class="perm-label">Lab Exams</div>
              <div class="perm-sub">Lab results</div>
            </div>
          </div>
          <div class="perm-toggle">
            <div class="toggle-switch off"><div class="toggle-knob off"></div></div>
            <div class="perm-text">
              <div class="perm-label">Photos</div>
              <div class="perm-sub">Progress pics</div>
            </div>
          </div>
          <div class="perm-toggle">
            <div class="toggle-switch off"><div class="toggle-knob off"></div></div>
            <div class="perm-text">
              <div class="perm-label">Workouts</div>
              <div class="perm-sub">Training data</div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="sheet-actions">
      <button class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L6 12L14 4" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Send Invite
      </button>
      <button class="btn-secondary">Cancel</button>
    </div>

  </div>

</div>
</body>
</html>
