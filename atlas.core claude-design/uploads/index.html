<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>atlas.core — app screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #efe9da; }
  body { font-family: "Inter", -apple-system, sans-serif; }
  * { box-sizing: border-box; }

  .tweaks {
    position: fixed; right: 20px; bottom: 20px; z-index: 100;
    width: 260px; background: #111; color: #eee;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    padding: 18px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    display: none;
  }
  .tweaks.on { display: block; }
  .tweaks h3 {
    margin: 0 0 14px; font-size: 10px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase; color: #888;
  }
  .tweaks label { display: block; margin-bottom: 14px; }
  .tweaks label > span {
    display: block; font-size: 9px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; color: #888;
    margin-bottom: 6px;
  }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches button {
    width: 28px; height: 28px; border: 2px solid transparent;
    cursor: pointer; padding: 0;
  }
  .swatches button.sel { border-color: #fff; }
  .seg { display: flex; gap: 1px; background: #222; padding: 2px; }
  .seg button {
    flex: 1; padding: 6px 4px; border: 0; background: transparent;
    font-family: inherit; font-size: 10px; font-weight: 500;
    cursor: pointer; color: #888; text-transform: uppercase; letter-spacing: 1px;
  }
  .seg button.sel { background: #fff; color: #111; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  window.ACTweaks = /*EDITMODE-BEGIN*/{
    "palette": "noir-sulfur",
    "ecg": "classic"
  }/*EDITMODE-END*/;

  window.ACPalettes = {
    "noir-sulfur":  { name: "noir / sulfur",   ink: "#0a0a0a", bg: "#efe9da", accent: "#e8b500" },
    "carbon-blood": { name: "carbon / blood",  ink: "#0a0a0a", bg: "#eceae5", accent: "#e8391f" },
    "jet-sunset":   { name: "jet / sunset",    ink: "#111111", bg: "#efe6d8", accent: "#ff5f1f" },
    "steel-cyan":   { name: "steel / cyan",    ink: "#0a1020", bg: "#e6e8ee", accent: "#00c8ff" },
    "oxblood-bone": { name: "oxblood / bone",  ink: "#2a0a10", bg: "#ece4d6", accent: "#c2391a" },
    "pitch-white":  { name: "pitch / white",   ink: "#050505", bg: "#fafafa", accent: "#050505" },
  };

  function applyTheme() {
    const pal = window.ACPalettes[window.ACTweaks.palette] || window.ACPalettes["noir-sulfur"];
    window.ACTheme = { ...pal, ecg: window.ACTweaks.ecg };
    document.body.style.background = pal.bg;
    window.dispatchEvent(new CustomEvent('actheme-change'));
  }
  applyTheme();
</script>

<div class="tweaks" id="tweaks">
  <h3>// Tweaks</h3>
  <label>
    <span>Palette</span>
    <div class="swatches" id="sw-palette"></div>
  </label>
  <label>
    <span>ECG spike</span>
    <div class="seg" id="seg-ecg">
      <button data-v="classic">Classic</button>
      <button data-v="sharp">Sharp</button>
      <button data-v="flat">Flatline</button>
    </div>
  </label>
</div>

<script>
  const tweaksEl = document.getElementById('tweaks');
  (function () {
    const host = document.getElementById('sw-palette');
    Object.entries(window.ACPalettes).forEach(([key, p]) => {
      const b = document.createElement('button');
      b.dataset.v = key;
      b.title = p.name;
      b.style.background = `linear-gradient(135deg, ${p.ink} 0 50%, ${p.accent} 50% 100%)`;
      b.onclick = () => setKey('palette', key);
      host.appendChild(b);
    });
  })();
  document.querySelectorAll('#seg-ecg button').forEach((b) => {
    b.onclick = () => setKey('ecg', b.dataset.v);
  });
  function syncUI() {
    document.querySelectorAll('#sw-palette button').forEach((b) =>
      b.classList.toggle('sel', b.dataset.v === window.ACTweaks.palette));
    document.querySelectorAll('#seg-ecg button').forEach((b) =>
      b.classList.toggle('sel', b.dataset.v === window.ACTweaks.ecg));
  }
  syncUI();
  function setKey(k, v) {
    window.ACTweaks[k] = v;
    applyTheme();
    syncUI();
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  }
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === '__activate_edit_mode') tweaksEl.classList.add('on');
    if (d.type === '__deactivate_edit_mode') tweaksEl.classList.remove('on');
  });
  window.parent.postMessage({ type: '__edit_mode_available' }, '*');
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
